name: Sync Dev workspace from Git
on:
  push:
    branches: [development]
jobs:
  sync:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Get access token
        id: auth
        run: |
          if [[ -z "$AZURE_CREDENTIALS" ]]; then
            echo "::error::AZURE_CREDENTIALS is missing from the dev GitHub environment secrets."
            exit 1
          fi

          if ! printf '%s' "$AZURE_CREDENTIALS" | jq -e '(.tenantId | type == "string" and length > 0) and (.clientId | type == "string" and length > 0) and (.clientSecret | type == "string" and length > 0)' >/dev/null 2>&1; then
            echo "::error::AZURE_CREDENTIALS must be JSON with non-empty tenantId, clientId, and clientSecret fields."
            exit 1
          fi

          TENANT_ID=$(printf '%s' "$AZURE_CREDENTIALS" | jq -r '.tenantId')
          CLIENT_ID=$(printf '%s' "$AZURE_CREDENTIALS" | jq -r '.clientId')
          CLIENT_SECRET=$(printf '%s' "$AZURE_CREDENTIALS" | jq -r '.clientSecret')

          AUTH_RESPONSE=$(curl -sS -X POST "https://login.microsoftonline.com/$TENANT_ID/oauth2/v2.0/token" \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "client_secret=$CLIENT_SECRET" \
            --data-urlencode "scope=https://api.fabric.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials")

          TOKEN=$(echo "$AUTH_RESPONSE" | jq -r .access_token)
          if [[ "$TOKEN" == "null" || -z "$TOKEN" ]]; then
            echo "::error::Failed to acquire token. AAD error response below:"
            echo "$AUTH_RESPONSE" | jq -r '{error, error_description}' 2>/dev/null || echo "$AUTH_RESPONSE"
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Trigger updateFromGit
        run: |
          STATUS_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            "https://api.fabric.microsoft.com/v1/workspaces/${{ vars.WORKSPACE_ID }}/git/status" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}")
          STATUS_CODE=$(echo "$STATUS_RESPONSE" | grep -oP '(?<=HTTP_STATUS:)\d+')
          STATUS_BODY=$(echo "$STATUS_RESPONSE" | sed '$d')
          if [[ "$STATUS_CODE" -lt 200 || "$STATUS_CODE" -ge 300 ]]; then
            echo "::error::Git status call failed with status $STATUS_CODE"
            echo "$STATUS_BODY"
            exit 1
          fi

          REQUEST_BODY=$(echo "$STATUS_BODY" | jq -c '{remoteCommitHash, workspaceHead}')
          if [[ "$(echo "$REQUEST_BODY" | jq -r '.remoteCommitHash // empty')" == "" ]]; then
            echo "::error::Git status response did not include remoteCommitHash"
            echo "$STATUS_BODY"
            exit 1
          fi

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://api.fabric.microsoft.com/v1/workspaces/${{ vars.WORKSPACE_ID }}/git/updateFromGit" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY")
          HTTP_STATUS=$(echo "$RESPONSE" | grep -oP '(?<=HTTP_STATUS:)\d+')
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Response body: $BODY"
          echo "Status code: $HTTP_STATUS"
          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "::error::updateFromGit call failed with status $HTTP_STATUS"
            exit 1
          fi